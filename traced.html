<!doctype html>
<!--
================================================================================
  TRACED TILE GENERATOR
================================================================================

  WHAT IT DOES
  ------------
  The third version, kept separate from geometric_tiles.html and
  wonky_tiles.html. Instead of generating a grid and a tiling, it uses the
  grid and the pieces TRACED FROM sample.jpg: every grid corner sits where it
  sits in the sample, and every piece has the same outline as in the sample.
  Only the colouring is new, done with the same code as the other versions
  (colour schemes, orange colour, outlines, texture, hand-drawn lines).

  HOW THE TRACING WAS DONE (once, by a separate script - not part of this page)
  -----------------------------------------------------------------------------
    1. The 32 orange squares were found by their colour. Their corners give
       128 of the grid's corner points directly, because every grid line in
       the sample runs along the edge of some orange square.
    2. The other corners were filled in along the grid lines between those,
       then nudged to sit on the nearest colour edges in the picture.
       The outer ring of corners is extended past the frame, so pieces at the
       edge are cut off by the frame just like in the sample.
    3. Each square was split into 4 quarter-triangles. Quarters were joined
       into pieces wherever the sample shows no colour edge between them (a
       square is either whole or cut along one diagonal).
    4. The result was checked by redrawing it in the sample's own colours next
       to the original.
  The phone screenshot has two round buttons over the top corners; the
  pieces hidden under them are a best guess.

  The traced data (corner positions + pieces) is in section 2.

  HOW TO USE
  ----------
  Just open this file in a web browser (double-click it). Nothing needs to
  be installed. The only thing loaded from the internet is the jsPDF library,
  used by the "Save PDF" button.

  HOW THE FILE IS ORGANISED
  -------------------------
    1. <style>   - how the page looks (colours, buttons, print layout)
    2. HTML      - the buttons, sliders and the drawing area (<canvas>)
    3. <script>  - the program, in these sections:
         1. Settings           - grid size, colours, orange pattern
         2. The traced grid    - corner positions and pieces from sample.jpg
         4. Colouring          - picks a colour for each piece, and the
                                 colour scheme row (menu + colour chips)
         5. Drawing            - hand-drawn lines, and painting everything
         6. Buttons & sliders  - what each control does
         7. Saving & printing  - PNG, PDF, print
       (There is no section 3: the other versions use it for the puzzle
       solver, which isn't needed here because the pieces are traced.)

  QUICK THINGS TO CHANGE
  ----------------------
    Starting orange colour ... ORANGE (section 1) + the orange R/G/B "value"
                               attributes in the HTML and the oswatch colour
    Colour scheme menu ....... SCHEMES              (section 1)
    Starting line wobble ..... wonk (section 5) + the slider's "value"
    Shape of the line wobble . wobblyLine()         (section 5)
    Crayon texture strength .. makeGrain()          (section 5)
    Outline thickness ........ pencil(pts, 3) in render() (section 5)
    Starting outline colour .. the R/G/B "value" attributes in the HTML,
                               plus opt.line and the swatch colour
================================================================================
-->

<meta charset="utf-8">
<title>Traced Tile Generator</title>

<style>
  /* ---- General page look ---- */
  body   { font: 15px system-ui; background: #efeae6; color: #333; text-align: center; margin: 20px; }
  canvas { max-width: 95vw; max-height: 80vh; background: #fff; box-shadow: 0 4px 22px #0003; }
  button, label { margin: 8px; padding: 9px; }
  button { cursor: pointer; }
  #info  { font-size: 13px; color: #666; }

  /* ---- Toolbars (the rows of buttons at the top) ---- */
  .bar { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; align-items: center;
         margin: 6px auto; max-width: 1100px; }
  .bar label { margin: 0 4px; padding: 4px; }

  /* ---- R / G / B sliders and the little colour preview box ---- */
  .rgb input  { width: 90px; vertical-align: middle; }
  .rgb output { display: inline-block; width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .swatch     { display: inline-block; width: 22px; height: 22px; border: 1px solid #888;
                vertical-align: middle; border-radius: 3px; }

  /* ---- Colour scheme chips: a colour picker with a small "x" to remove it ---- */
  #chips { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .chip  { display: inline-flex; align-items: center; border: 1px solid #bbb; border-radius: 4px; background: #fff; padding: 1px; margin: 0; }
  .chip input  { width: 28px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
  .chip button { margin: 0; padding: 0 4px; border: 0; background: none; color: #888; font-size: 14px; line-height: 1; }
  .chip button:hover { color: #c00; }
  #scheme { padding: 5px; }

  /* On/off buttons are shown in purple while they are "on" */
  button[aria-pressed="true"] { background: #5b4a8c; color: #fff; border: 1px solid #5b4a8c; }

  /* ---- When printing: hide everything except the picture ---- */
  @media print {
    body { margin: 0; background: #fff; }
    h2, .bar, #info { display: none; }
    canvas { max-width: 100%; max-height: 100vh; box-shadow: none; display: block; margin: 0 auto; }
    @page { margin: 10mm; }
  }
</style>

<h2>Traced Tile Generator</h2>

<!-- Orange tile colour: R, G, B sliders (start at the default orange 251, 106, 60) -->
<div class="bar">
  <strong>Orange tile colour</strong>
  <span class="rgb">
    <span id="oswatch" class="swatch" style="background: rgb(251,106,60)"></span>
    <label>R <input id="or" type="range" min="0" max="255" value="251" oninput="orangeColour()"><output id="orv">251</output></label>
    <label>G <input id="og" type="range" min="0" max="255" value="106" oninput="orangeColour()"><output id="ogv">106</output></label>
    <label>B <input id="ob" type="range" min="0" max="255" value="60"  oninput="orangeColour()"><output id="obv">60</output></label>
  </span>
</div>

<!-- Colour scheme: pick a ready-made scheme, or click any colour chip to change it.
     Chips are created by showChips() in section 4. Last: texture on/off. -->
<div class="bar">
  <strong>Colour scheme</strong>
  <select id="scheme" onchange="pickScheme(this.value)"></select>
  <span id="chips"></span>
  <button onclick="addColour()">+ Add colour</button>
  <button id="textureBtn" aria-pressed="true" onclick="toggle('texture', this)">Texture: on</button>
</div>

<!-- Line wobble: how much lines waver (percentage of one square). Re-wobble = new random wobbles. -->
<div class="bar">
  <strong>Hand-drawn lines</strong>
  <label>Line wobble <input id="wline" type="range" min="0" max="8" step="0.5" value="2" oninput="setWonk()"><output id="wlinev">2%</output></label>
  <button onclick="newWonk(); render()">Re-wobble</button>
</div>

<!-- Top row: outline on/off, outline colour (R, G, B), colours on/off -->
<div class="bar">
  <button id="outlineBtn" aria-pressed="true" onclick="toggle('outlines', this)">Outlines: on</button>
  <span class="rgb">
    <span id="swatch" class="swatch" style="background: rgb(200,200,200)"></span>
    <label>R <input id="r" type="range" min="0" max="255" value="200" oninput="lineColour()"><output id="rv">200</output></label>
    <label>G <input id="g" type="range" min="0" max="255" value="200" oninput="lineColour()"><output id="gv">200</output></label>
    <label>B <input id="b" type="range" min="0" max="255" value="200" oninput="lineColour()"><output id="bv">200</output></label>
  </span>
  <button id="colourBtn" aria-pressed="true" onclick="toggle('colours', this)">Colours: on</button>
</div>

<!-- Second row: new colours, save, print, show grid -->
<div class="bar">
  <button onclick="recolour()">New colours</button>
  <button onclick="save()">Save PNG</button>
  <button onclick="savePdf()">Save PDF</button>
  <button onclick="window.print()">Print</button>
  <label><input id="lines" type="checkbox" onchange="render()">Show grid</label>
</div>

//     so each orange row is shifted 2 columns from the one before.
// This is the same diamond-like layout as in sample.jpg.
function isOrange(i, j) {
  return j % 2 === 1 && i % 4 === (j % 4 === 1 ? 1 : 3);

// Turns a quarter into a text label like "3,5,1", so it can be stored in Sets/Maps.
const key = (i, j, d) => i + ',' + j + ',' + d;

// The 4 directions as steps on screen, in the same order as quarter numbers:
// East, North, West, South.
const D = [[1, 0], [0, -1], [-1, 0], [0, 1]];

let pieces = [];          // the traced pieces (each has cov = its quarters, and color)
let owner  = new Map();   // quarter label -> which piece (its index in `pieces`) covers it
let grain  = null;        // the crayon texture image (made in makeGrain)

// Reads the traced pieces into `pieces` and `owner`, then colours and draws them.
function loadTraced() {
  pieces = PIECES.map(line => ({ cov: line.split(' ') }));
  owner = new Map();
  pieces.forEach((p, n) => p.cov.forEach(u => owner.set(u, n)));
  document.getElementById('info').textContent =
    `${pieces.length} pieces and 32 orange squares, traced from sample.jpg`;
  newWonk();
  recolour();
}


/* =============================================================================
   4. COLOURING
   ============================================================================= */

// "New colours" button: gives every piece a random colour from PALETTE,
// avoiding the colours of the pieces it touches (so neighbours never match).
function recolour() {
  // Find each piece's neighbours by looking across every edge of every quarter.
  const neighbours = pieces.map(() => new Set());
  for (const [u, n] of owner) {
    const [i, j, d] = u.split(',').map(Number);
    const across = [
      key(i + D[d][0], j + D[d][1], (d + 2) % 4),  // the quarter on the other side of the square's edge
      key(i, j, (d + 1) % 4),                      // the quarters on either side of the diagonals
      key(i, j, (d + 3) % 4),
    ];
    for (const v of across) {
      const m = owner.get(v);
      if (m !== undefined && m !== n) neighbours[n].add(m);
    }
  }

  pieces.forEach(p => p.color = null);
  pieces.forEach((p, n) => {
    const used = new Set([...neighbours[n]].map(m => pieces[m].color));
    const free = PALETTE.filter(col => !used.has(col));
    const choices = free.length ? free : PALETTE;
    p.color = choices[Math.floor(Math.random() * choices.length)];
  });

  grain = null;   // make a fresh texture too
  render();
}

// ---- The "Colour scheme" row ----

// Fills the scheme menu with the names from SCHEMES, plus "Custom",
// which is selected automatically once you edit a colour.
function setUpSchemeMenu() {
  const menu = document.getElementById('scheme');
  menu.innerHTML = Object.keys(SCHEMES).map(name => `<option>${name}</option>`).join('')
                 + '<option value="custom" disabled>Custom</option>';
}

// Choosing a scheme from the menu: use its colours and recolour the picture.
function pickScheme(name) {
  PALETTE = [...SCHEMES[name]];
  showChips();
  recolour();
}

// Shows one chip per colour in PALETTE. Each chip is a colour picker
// (click it to change that colour) with an "x" to remove the colour.
function showChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  PALETTE.forEach((colour, k) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `<input type="color" value="${colour}" title="Click to change this colour"><button title="Remove this colour">×</button>`;

    // Changing a colour: every piece painted in the old colour switches to
    // the new one straight away, without changing anything else.
    const picker = chip.querySelector('input');
    picker.oninput = () => {
      const old = PALETTE[k];
      PALETTE[k] = picker.value;
      pieces.forEach(p => { if (p.color === old) p.color = picker.value; });
      markCustom();
      render();
    };

    // Removing a colour (always keeps at least 2), then recolouring.
    chip.querySelector('button').onclick = () => {
      if (PALETTE.length <= 2) { alert('A scheme needs at least 2 colours.'); return; }
      PALETTE.splice(k, 1);
      markCustom();
      showChips();
      recolour();
    };
    box.appendChild(chip);
  });
}

// "+ Add colour" button: adds a random colour (click its chip to change it).
function addColour() {
  PALETTE.push('#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
  markCustom();
  showChips();
  recolour();
}

// Shows "Custom" in the menu once the colours no longer match a ready-made scheme.
function markCustom() {
  document.getElementById('scheme').value = 'custom';
}


/* =============================================================================
   5. DRAWING
   -----------------------------------------------------------------------------
   The grid corners come straight from the traced data (section 2), so the
   squares are exactly as irregular as in the sample. On top of that, every
   line can be given a hand-drawn waver (the "Line wobble" slider):

   HAND-DRAWN LINES. Every line between two points is drawn as a gently
   wavering line instead of a perfectly straight one: a slight bow plus two
   small wiggles, fading to nothing at both ends so lines still meet at the
   corners. Each line's wobble is worked out once and used by the pieces on
   BOTH sides of it, so colours still meet with no gaps.

   The random numbers are kept as values between -1 and 1, and only multiplied
   by the slider setting when drawing. So dragging the slider changes the
   amount smoothly; "Re-wobble" makes new random numbers.
   ============================================================================= */

const S = c.width / W;   // average size of one square in pixels (sets the wobble size)

// Current slider setting, as a fraction of a square (0.02 = 2%).
const wonk = { wobble: 0.02 };

let wobbles = new Map();   // line id -> its random wobble numbers

// A random number from -1 to 1 that is usually close to 0
// (the average of 3 dice rolls).
const wobbleRandom = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

// New random line wobbles ("Re-wobble").
function newWonk() {
  wobbles = new Map();
}

// ---- Points ----
// Each point has a name: "c3,5" = grid corner (3,5), "m3,5" = centre of square (3,5).

// Where grid corner (i, j) is, in pixels (traced from the sample).
function cornerPoint(i, j) {
  return CORNERS[j][i];
}

// Where the centre of square (i, j) is: the point where its two diagonals cross.
function centrePoint(i, j) {
  const p = cornerPoint(i, j),     q = cornerPoint(i + 1, j + 1);   // diagonal 1: top-left to bottom-right
  const u = cornerPoint(i + 1, j), v = cornerPoint(i, j + 1);       // diagonal 2: top-right to bottom-left
  const d1 = [q[0] - p[0], q[1] - p[1]], d2 = [v[0] - u[0], v[1] - u[1]];
  const t = ((u[0] - p[0]) * d2[1] - (u[1] - p[1]) * d2[0]) / (d1[0] * d2[1] - d1[1] * d2[0]);
  return [p[0] + t * d1[0], p[1] + t * d1[1]];
}

function point(name) {
  const [i, j] = name.slice(1).split(',').map(Number);
  return name[0] === 'c' ? cornerPoint(i, j) : centrePoint(i, j);
}

// ---- Hand-drawn lines ----

let lineCache = new Map();   // lines already worked out during this redraw

// Returns the wavering line from point A to point B as a list of [x, y] points.
// The list also carries .w, the line's random numbers (used for pencil strokes).
function wobblyLine(nameA, nameB) {
  // Store each line once, always in the same direction, so the pieces on
  // both sides get exactly the same line (just reversed for one of them).
  const flip = nameA > nameB;
  const [p, q] = flip ? [nameB, nameA] : [nameA, nameB];
  const id = p + '|' + q;

  let pts = lineCache.get(id);
  if (!pts) {
    let w = wobbles.get(id);
    if (!w) {
      w = { bow: wobbleRandom(), a1: wobbleRandom(), a2: wobbleRandom(),
            f1: Math.random() * 2 * Math.PI, f2: Math.random() * 2 * Math.PI };
      wobbles.set(id, w);
    }
    const A = point(p), B = point(q);
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;   // direction straight out to the side of the line

    const amount = wonk.wobble * S;

    pts = [];
    const steps = Math.max(2, Math.ceil(len / 5));   // a point every ~5 pixels
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const fade = Math.sin(Math.PI * t);            // 0 at both ends, 1 in the middle
      const side = amount * fade * (0.6 * w.bow                                    // gentle bow
                                  + 0.35 * w.a1 * Math.sin(3 * Math.PI * t + w.f1) // slow wiggle
                                  + 0.2 * w.a2 * Math.sin(8 * Math.PI * t + w.f2)); // small fast wiggle
      pts.push([A[0] + dx * t + nx * side, A[1] + dy * t + ny * side]);
    }
    pts.w = w;
    lineCache.set(id, pts);
  }
  if (!flip) return pts;
  const back = pts.slice().reverse();
  back.w = pts.w;
  return back;
}

// Joins several lines into one outline (a list of points going round a shape).
function outline(names) {
  const pts = [];
  for (let k = 0; k < names.length; k++) pts.push(...wobblyLine(names[k], names[(k + 1) % names.length]));
  return pts;
}

// Follows a list of points with the pen (doesn't draw yet).
function trace(pts, dx = 0, dy = 0) {
  ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy);
  for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0] + dx, pts[k][1] + dy);
}

// Draws one line like a pencil stroke: a main stroke whose thickness varies a
// little from line to line, plus a faint thinner second stroke just beside it.
function pencil(pts, width) {
  const w = pts.w;
  ctx.lineWidth = width * (0.85 + 0.2 * w.a1);
  ctx.beginPath(); trace(pts); ctx.stroke();
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = width * 0.5;
  ctx.beginPath(); trace(pts, 0.7 * w.a2, 0.7 * w.bow); ctx.stroke();
  ctx.globalAlpha = 1;
}

// The two outer corners of quarter d in square (i, j), as point names.
// (The third corner of every quarter is the square's centre.)
function corners(i, j, d) {
  const cn = (x, y) => 'c' + x + ',' + y;
  return [
    [cn(i + 1, j),     cn(i + 1, j + 1)],   // 0 East:  right edge
    [cn(i, j),         cn(i + 1, j)],       // 1 North: top edge
    [cn(i, j + 1),     cn(i, j)],           // 2 West:  left edge
    [cn(i + 1, j + 1), cn(i, j + 1)],       // 3 South: bottom edge
  ][d];
}

// Crayon-like texture: 60,000 short, faint diagonal strokes (half light, half
// dark) drawn on a separate transparent image and laid over the colours.
// Made once per colouring so it doesn't change every time the page redraws.
// To make the texture stronger or softer, change the numbers after "Math.random()*"
// in the rgba(...) values (these are how see-through the strokes are).
function makeGrain() {
  const g = document.createElement('canvas');
  g.width = c.width; g.height = c.height;
  const x = g.getContext('2d');
  x.lineCap = 'round';
  for (let n = 0; n < 60000; n++) {
    const px = Math.random() * g.width, py = Math.random() * g.height;
    const angle  = -1.05 + (Math.random() - 0.5) * 0.5;   // roughly 60°, like hand shading
    const length = 3 + Math.random() * 9;
    x.strokeStyle = Math.random() < 0.5
      ? `rgba(255,255,255,${0.05 + Math.random() * 0.1})`
      : `rgba(30,10,40,${0.04 + Math.random() * 0.08})`;
    x.lineWidth = 0.6 + Math.random() * 1.1;
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(angle) * length, py + Math.sin(angle) * length);
    x.stroke();
  }
  return g;
}

// Current settings of the on/off buttons and the outline colour.
const opt = {
  outlines: true,                 // "Outlines" button
  colours:  true,                 // "Colours" button
  texture:  true,                 // "Texture" button (crayon grain)
  line:     'rgb(200,200,200)',   // outline colour (set by the R/G/B sliders)
};

// Draws the whole picture. Called whenever anything changes.
function render() {
  lineCache = new Map();   // positions may have changed (sliders), so work lines out afresh
  ctx.lineJoin = ctx.lineCap = 'round';

  // White background.
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);

  if (opt.colours) {
    // Orange squares (four wobbly sides each).
    ctx.fillStyle = ctx.strokeStyle = ORANGE;
    ctx.lineWidth = 1;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        if (!isOrange(i, j)) continue;
        ctx.beginPath();
        trace(outline(['c' + i + ',' + j, 'c' + (i + 1) + ',' + j, 'c' + (i + 1) + ',' + (j + 1), 'c' + i + ',' + (j + 1)]));
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }

    // Every piece, one quarter-triangle at a time, in that piece's colour.
    // (Each triangle is also stroked in the same colour to hide hairline gaps.)
    for (const [u, n] of owner) {
      const [i, j, d] = u.split(',').map(Number);
      const [a, b] = corners(i, j, d);
      ctx.fillStyle = ctx.strokeStyle = pieces[n].color;
      ctx.beginPath();
      trace(outline(['m' + i + ',' + j, a, b]));
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    // Crayon texture on top (if the "Texture" button is on).
    if (opt.texture) {
      if (!grain) grain = makeGrain();
      ctx.drawImage(grain, 0, 0);
    }
  }

  // Lines between pieces:
  //   outlines on  -> pencil-like lines in the chosen colour
  //   outlines off -> thin soft shadow lines (only if colours are on)
  if (opt.outlines || opt.colours) {
    ctx.strokeStyle = opt.outlines ? opt.line : 'rgba(40,20,50,.22)';

    // For each quarter, draw an edge only where the quarter next to it belongs
    // to a different piece (or to nothing: orange square / outside the picture).
    // `done` makes sure each line is only drawn once.
    const done = new Set();
    const edge = (A, B) => {
      const id = A < B ? A + '|' + B : B + '|' + A;
      if (done.has(id)) return;
      done.add(id);
      const pts = wobblyLine(A, B);
      if (opt.outlines) pencil(pts, 3);
      else { ctx.lineWidth = 1.5; ctx.beginPath(); trace(pts); ctx.stroke(); }
    };
    for (const [u, n] of owner) {
      const [i, j, d] = u.split(',').map(Number);
      const [a, b] = corners(i, j, d);
      // the square's own edge
      if (owner.get(key(i + D[d][0], j + D[d][1], (d + 2) % 4)) !== n) edge(a, b);
      // the diagonal from the centre to corner b (shared with quarter d+3)
      if (owner.get(key(i, j, (d + 3) % 4)) !== n) edge('m' + i + ',' + j, b);
    }

    // With outlines on, also draw the outer frame (fully visible, just inside the edge).
    if (opt.outlines) { ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, c.width - 3, c.height - 3); }
  }

  drawGrid();
}

// Faint (wonky) grid lines over everything, when "Show grid" is ticked.
function drawGrid() {
  if (!document.getElementById('lines').checked) return;
  ctx.strokeStyle = '#0004';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let j = 0; j <= H; j++)
    for (let i = 0; i <= W; i++) {
      if (i < W) trace(wobblyLine('c' + i + ',' + j, 'c' + (i + 1) + ',' + j));
      if (j < H) trace(wobblyLine('c' + i + ',' + j, 'c' + i + ',' + (j + 1)));
    }
  ctx.stroke();
}


/* =============================================================================
   6. BUTTONS AND SLIDERS
   ============================================================================= */

// "Outlines", "Colours" and "Texture" buttons: flips the setting on/off, updates the
// button's label ("...: on" / "...: off") and redraws.
function toggle(name, btn) {
  opt[name] = !opt[name];
  btn.setAttribute('aria-pressed', opt[name]);   // makes the button purple when on
  btn.textContent = btn.textContent.split(':')[0] + ': ' + (opt[name] ? 'on' : 'off');
  render();
}

// R / G / B sliders: reads the three values, shows the numbers and the
// preview swatch, and redraws the outlines in the new colour.
function lineColour() {
  const v = ['r', 'g', 'b'].map(id => document.getElementById(id).value);
  ['r', 'g', 'b'].forEach((id, k) => document.getElementById(id + 'v').textContent = v[k]);
  opt.line = `rgb(${v})`;
  document.getElementById('swatch').style.background = opt.line;
  render();
}

// "Orange tile colour" R / G / B sliders (just below the page title): same idea,
// but changes the colour of the fixed orange squares.
function orangeColour() {
  const v = ['or', 'og', 'ob'].map(id => document.getElementById(id).value);
  ['or', 'og', 'ob'].forEach((id, k) => document.getElementById(id + 'v').textContent = v[k]);
  ORANGE = `rgb(${v})`;
  document.getElementById('oswatch').style.background = ORANGE;
  render();
}


// "Line wobble" slider: reads the value, shows it as a percentage and redraws.
// (The random wobbles stay the same, only how strongly they are used changes.)
function setWonk() {
  const l = Number(document.getElementById('wline').value);
  document.getElementById('wlinev').textContent = l + '%';
  wonk.wobble = l / 100;
  render();
}


/* =============================================================================
   7. SAVING AND PRINTING
   (The "Print" button just calls the browser's window.print(). The print
   layout is set by the @media print rules in the <style> section.)
   ============================================================================= */

// "Save PNG" button: downloads the picture as an image file.
function save() {
  const a = document.createElement('a');
  a.download = 'traced-tiling.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

// "Save PDF" button: puts the picture, centred, on an A4 page (12 mm margins).
//   - Chrome / Edge: opens the normal "Save as" window (showSaveFilePicker).
//   - Other browsers: downloads it to the Downloads folder.
async function savePdf() {
  if (!window.jspdf) {
    alert('The PDF library could not load (no internet?). Use Print and choose "Save as PDF" instead.');
    return;
  }
  const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const pageW = 210, pageH = 297, margin = 12;   // A4 size in mm
  const scale = Math.min((pageW - 2 * margin) / c.width, (pageH - 2 * margin) / c.height);
  const w = c.width * scale, h = c.height * scale;
  pdf.addImage(c.toDataURL('image/png'), 'PNG', (pageW - w) / 2, (pageH - h) / 2, w, h);

  const blob = pdf.output('blob');
  const name = 'traced-tiling.pdf';

  if (window.showSaveFilePicker) {
    try {
      const fh = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'PDF document', accept: { 'application/pdf': ['.pdf'] } }],
      });
      const ws = await fh.createWritable();
      await ws.write(blob);
      await ws.close();
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not save: ' + e.message);   // AbortError = user pressed Cancel
    }
    return;
  }

  // Fallback: ordinary download.
  const a = document.createElement('a');
  a.download = name;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

setUpSchemeMenu();
